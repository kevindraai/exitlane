# Experimental D5 appliance. Use the checked launcher; Engine >=28/Compose v2 required.
# No public production image exists yet. Supply an immutable locally built image identity.
services:
  exitlane:
    image: ${EXITLANE_IMAGE:?Supply an immutable image digest or locally loaded image ID}
    platform: linux/amd64
    init: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /run:rw,nosuid,nodev,noexec,size=32m,mode=0700
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=0700
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "0"
      net.ipv4.ping_group_range: "0 0"
    environment:
      EXITLANE_RUNTIME: container
      EXITLANE_CONFIG_DIR: /data/config
      EXITLANE_DATA_DIR: /data/state
      EXITLANE_PUBLIC_URL: ${EXITLANE_PUBLIC_URL:-}
      EXITLANE_TRUSTED_PROXIES: ${EXITLANE_TRUSTED_PROXIES:-}
    ports:
      - "${EXITLANE_MANAGEMENT_BIND:-127.0.0.1}:8787:8787/tcp"
      - "${EXITLANE_INGRESS_BIND:-127.0.0.1}:51820:51820/udp"
    volumes: [exitlane-state:/data]
    networks: [exitlane]
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  exitlane:
    driver: bridge
    enable_ipv6: false
volumes:
  exitlane-state:
