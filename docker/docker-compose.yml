# Development image only. This container cannot control a NordVPN client on the Docker host.
# The supported VPN gateway deployment is the native systemd installer in docs/deployment.md.
services:
  exitlane:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Development management access is host-local; no VPN ingress is published.
    ports: ["127.0.0.1:8787:8787"]
    volumes: [exitlane-data:/data]
    restart: unless-stopped
volumes:
  exitlane-data:
