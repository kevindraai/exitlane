name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check Bash syntax
        run: |
          find installer \
            -type f \
            -name "*.sh" \
            -print0 |
            xargs -0 -r -n1 bash -n

      - name: Run ShellCheck
        run: |
          find installer \
            -type f \
            -name "*.sh" \
            -print0 |
            xargs -0 -r shellcheck

      - name: Validate workflow security policy
        run: python3 scripts/check_workflow_security.py

  backend:
    name: Python backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install Exitlane
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Run Bandit
        run: bandit -c pyproject.toml -r exitlane

      - name: Audit Python dependencies
        # ExitLane is the sole editable package and is not published on PyPI.
        # Audit every installed third-party dependency, including dev tools.
        run: pip-audit --skip-editable

      - name: Compile Python sources
        run: python -m compileall -q exitlane

      - name: Run tests
        run: pytest -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          find backend/exitlane/static/js \
            -type f \
            -name "*.js" \
            -print0 |
            xargs -0 -r -n1 node --check

      - name: Run frontend tests
        run: node --experimental-default-type=module --test frontend_tests/*.test.js

      - name: Validate JSON files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = sorted(
              Path("backend/exitlane/static").rglob("*.json")
          )

          for path in files:
              with path.open(
                  encoding="utf-8"
              ) as handle:
                  json.load(handle)

              print(f"Valid JSON: {path}")
          PY

      - name: Validate translations
        run: python3 scripts/check_i18n.py

  container-lifecycle:
    name: Container lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          base = os.environ.get("BASE_SHA", "")
          relevant = True
          if re.fullmatch(r"[0-9a-f]{40}", base) and set(base) != {"0"}:
              result = subprocess.run(
                  ["git", "diff", "--name-only", base, "HEAD"],
                  capture_output=True, text=True, check=False,
              )
              if result.returncode == 0:
                  relevant = any(
                      name.startswith(("backend/exitlane/", "docker/testing/", "scripts/qualification/", "backend/tests/test_container"))
                      or name in {
                          "backend/pyproject.toml", "backend/uv.lock",
                          "scripts/qualification/container_lifecycle.py",
                          ".github/workflows/ci.yml",
                      }
                      for name in result.stdout.splitlines()
                  )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"run={str(relevant).lower()}\n")
          PY

      - name: Build synthetic lifecycle image
        if: steps.changes.outputs.run == 'true'
        run: docker build -f docker/testing/Dockerfile.lifecycle -t exitlane-lifecycle:test .

      - name: Qualify isolated kernel lifecycle
        if: steps.changes.outputs.run == 'true'
        run: python3 scripts/qualification/container_lifecycle.py

      - name: Qualify synthetic direct-provider dataplane
        if: steps.changes.outputs.run == 'true'
        run: python3 scripts/qualification/container_dataplane.py --image exitlane-lifecycle:test

      - name: Qualify durable state and interrupted recovery
        if: steps.changes.outputs.run == 'true'
        run: python3 scripts/qualification/container_recovery.py --image exitlane-lifecycle:test

  container-appliance:
    name: Container appliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select relevant image and runtime changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path
          base = os.environ.get("BASE_SHA", "")
          relevant = True
          if re.fullmatch(r"[0-9a-f]{40}", base) and set(base) != {"0"}:
              result = subprocess.run(["git", "diff", "--name-only", base, "HEAD"],
                                      capture_output=True, text=True, check=False)
              if result.returncode == 0:
                  relevant = any(
                      name.startswith(("backend/exitlane/", "docker/", "scripts/qualification/",
                                       "backend/tests/test_container"))
                      or name in {"backend/pyproject.toml", "backend/uv.lock", "LICENSE",
                                  ".dockerignore", ".github/workflows/ci.yml",
                                  "scripts/check_container_image.py", "scripts/check_docker_appliance_host.py"}
                      for name in result.stdout.splitlines())
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"run={str(relevant).lower()}\n")
          PY

      - name: Build candidate from exact source with locked runtime dependencies
        if: steps.changes.outputs.run == 'true'
        run: |
          version=$(PYTHONPATH=backend python3 -c 'import exitlane; print("v" + exitlane.__version__)')
          docker build -f docker/Dockerfile.appliance \
            --build-arg EXITLANE_VERSION="$version" \
            --build-arg EXITLANE_REVISION="$(git rev-parse HEAD)" \
            -t exitlane-appliance:test .

      - name: Inspect installed image content without application startup or state
        if: steps.changes.outputs.run == 'true'
        run: |
          test "$(docker image inspect exitlane-appliance:test --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --entrypoint python \
            -i exitlane-appliance:test - < scripts/check_container_image.py

      - name: Install pinned image inspection tools
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          SYFT_VERSION=1.42.2
          TRIVY_VERSION=0.69.3
          SYFT_ARCHIVE="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          TRIVY_ARCHIVE="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/${SYFT_ARCHIVE}" \
            -o "/tmp/${SYFT_ARCHIVE}"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt" \
            -o /tmp/syft-checksums.txt
          (cd /tmp && grep -E '^[[:xdigit:]]{64}  syft_'"${SYFT_VERSION}"'_linux_amd64\.tar\.gz$' syft-checksums.txt | sha256sum --check --status)
          tar -xzf "/tmp/${SYFT_ARCHIVE}" -C /tmp syft
          sudo install -m 0755 /tmp/syft /usr/local/bin/syft
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${TRIVY_ARCHIVE}" \
            -o "/tmp/${TRIVY_ARCHIVE}"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt" \
            -o /tmp/trivy-checksums.txt
          (cd /tmp && grep -E '^[[:xdigit:]]{64}  trivy_'"${TRIVY_VERSION}"'_Linux-64bit\.tar\.gz$' trivy-checksums.txt | sha256sum --check --status)
          tar -xzf "/tmp/${TRIVY_ARCHIVE}" -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          rm -f "/tmp/${SYFT_ARCHIVE}" /tmp/syft-checksums.txt \
            "/tmp/${TRIVY_ARCHIVE}" /tmp/trivy-checksums.txt /tmp/syft /tmp/trivy

      - name: Create SPDX image SBOM
        if: steps.changes.outputs.run == 'true'
        run: syft exitlane-appliance:test --output spdx-json=exitlane-image.spdx.json

      - name: Upload SPDX image SBOM
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exitlane-image-spdx
          path: exitlane-image.spdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Scan candidate image for OS, Python and secret findings
        if: steps.changes.outputs.run == 'true'
        run: |
          trivy image --scanners vuln,secret --pkg-types os,library \
            --severity HIGH,CRITICAL --ignore-unfixed=false --exit-code 1 \
            exitlane-appliance:test

      - name: Qualify real application management and durable image replacement
        if: steps.changes.outputs.run == 'true'
        run: python3 scripts/qualification/container_appliance.py --image exitlane-appliance:test

  package:
    name: Package build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - backend
      - frontend
      - shell

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Upload Python package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exitlane-python-package
          path: |
            backend/dist/*.whl
            backend/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
