[Unit]
# A protected WireGuard ingress must not come up when both provider RPDB and
# nftables boot-guard restoration failed. The guard is a no-op when no direct
# provider connection or interrupted transition is persisted.
Requires=exitlane-provider-egress.service exitlane-management-routing.service
After=exitlane-provider-egress.service exitlane-management-routing.service

# Finish boot management preparation before creating the ingress interface.
# The CLI/app shared lock also serializes later reconciliation processes.

[Service]
# Reconcile configured non-provider destination routes after any WireGuard
# ingress interface is created or recreated. The command is interface-neutral;
# canonical subnet/interface data remains in ExitLane's application settings.
ExecStartPost=/usr/local/sbin/exitlane-cli reconcile-management-routes
# After shutdown, replace the disappearing connected route with an exact
# fail-closed route until this or another lifecycle path recreates it.
ExecStopPost=/usr/local/sbin/exitlane-cli reconcile-management-routes
